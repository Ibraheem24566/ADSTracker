<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdTracker Lead Capture Test Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .tracking-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>AdTracker Lead Capture Test Form</h1>
    
    <div class="tracking-info">
        <h3>Current Tracking Parameters</h3>
        <div id="trackingParams"></div>
    </div>

    <form id="leadForm">
        <div class="form-group">
            <label for="firstName">First Name *</label>
            <input type="text" id="firstName" name="firstName" required>
        </div>
        
        <div class="form-group">
            <label for="lastName">Last Name *</label>
            <input type="text" id="lastName" name="lastName" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone">
        </div>
        
        <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address">
        </div>
        
        <div class="form-group">
            <label for="zip">Zip Code</label>
            <input type="text" id="zip" name="zip">
        </div>
        
        <div class="form-group">
            <label for="leadSource">Lead Source</label>
            <select id="leadSource" name="leadSource">
                <option value="Google Ads">Google Ads</option>
                <option value="Facebook">Facebook</option>
                <option value="Website">Website</option>
                <option value="Referral">Referral</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="keyword">Keyword (for testing)</label>
            <input type="text" id="keyword" name="keyword" placeholder="e.g., solar quote">
        </div>
        
        <button type="submit">Submit Lead</button>
    </form>
    
    <div id="status" class="status"></div>

    <!-- AdTracker Webhook Script -->
    <script>
        // Configuration for local testing
        const API_BASE_URL = "http://localhost:3002";
        const API_USERNAME = "admin";
        const API_PASSWORD = "admin123";

        // Auto-detect gclid and UTM parameters from URL
        function getTrackingParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return {
                gclid: urlParams.get('gclid'),
                utm_source: urlParams.get('utm_source'),
                utm_medium: urlParams.get('utm_medium'),
                utm_campaign: urlParams.get('utm_campaign'),
                utm_term: urlParams.get('utm_term'),
                landing_page: window.location.href
            };
        }

        // Display current tracking parameters
        function displayTrackingParams() {
            const params = getTrackingParams();
            const trackingDiv = document.getElementById('trackingParams');
            trackingDiv.innerHTML = `
                <ul>
                    <li><strong>GCLID:</strong> ${params.gclid || 'None'}</li>
                    <li><strong>UTM Source:</strong> ${params.utm_source || 'None'}</li>
                    <li><strong>UTM Medium:</strong> ${params.utm_medium || 'None'}</li>
                    <li><strong>UTM Campaign:</strong> ${params.utm_campaign || 'None'}</li>
                    <li><strong>UTM Term:</strong> ${params.utm_term || 'None'}</li>
                    <li><strong>Landing Page:</strong> ${params.landing_page}</li>
                </ul>
            `;
        }

        // Send lead data to AdTracker API
        function sendLeadToAdTracker(leadData) {
            const trackingParams = getTrackingParams();
            
            const payload = {
                ...leadData,
                ...trackingParams,
                created_date: new Date().toISOString()
            };

            const auth = btoa(`${API_USERNAME}:${API_PASSWORD}`);
            const statusDiv = document.getElementById('status');

            fetch(`${API_BASE_URL}/api/leads/create-from-logs`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Basic ${auth}`
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                console.log('Lead synced to AdTracker:', data);
                statusDiv.style.display = 'block';
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `
                    <strong>Success!</strong> Lead synced to AdTracker.<br>
                    Lead ID: ${data.lead_id}<br>
                    Match Status: ${data.match_status}<br>
                    Keyword ID: ${data.keyword_id || 'None'}<br>
                    Campaign ID: ${data.campaign_id || 'None'}
                `;
            })
            .catch(error => {
                console.error('Failed to sync lead to AdTracker:', error);
                statusDiv.style.display = 'block';
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `<strong>Error:</strong> Failed to sync lead. ${error.message}`;
            });
        }

        // Intercept form submission
        document.getElementById('leadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const leadData = {};
            
            formData.forEach((value, key) => {
                leadData[key] = value;
            });

            // Map field names
            const mappedData = {
                crm_lead_id: leadData.leadId || null,
                first_name: leadData.firstName,
                last_name: leadData.lastName,
                email: leadData.email,
                phone: leadData.phone,
                full_address: leadData.address,
                zip_code: leadData.zip,
                lead_source: leadData.leadSource,
                raw_keyword_text: leadData.keyword
            };

            // Only send if we have email or phone
            if (mappedData.email || mappedData.phone) {
                sendLeadToAdTracker(mappedData);
            }
        });

        // Initialize
        displayTrackingParams();
    </script>
</body>
</html>
